name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests scripts
      - name: Unit, integration and permission tests
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: for f in app/static/js/*.js app/static/js/pages/*.js app/static/js/locales/*.js; do node --check "$f"; done
      - name: Shell scripts
        run: for f in scripts/*.sh docker/entrypoint.sh; do bash -n "$f"; done

  acme:
    name: Let's Encrypt flow (Pebble)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Start Pebble and its DNS test server
        run: |
          docker network create acme
          docker run -d --name challtestsrv --network acme -p 127.0.0.1:8055:8055             ghcr.io/letsencrypt/pebble-challtestsrv:latest -defaultIPv6 "" -defaultIPv4 127.0.0.1
          DNS_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' challtestsrv)
          docker run -d --name pebble --network acme -p 127.0.0.1:14000:14000             -e PEBBLE_VA_NOSLEEP=1 -e PEBBLE_WFE_NONCEREJECT=0             ghcr.io/letsencrypt/pebble:latest -config test/config/pebble-config.json -dnsserver "$DNS_IP:8053"
          curl -fsSL https://raw.githubusercontent.com/letsencrypt/pebble/main/test/certs/pebble.minica.pem -o /tmp/pebble.minica.pem
          for i in $(seq 1 30); do curl -fsS --cacert /tmp/pebble.minica.pem https://localhost:14000/dir >/dev/null && break; sleep 1; done
      - name: DNS-01 issuance, renewal and failure clean-up
        env:
          PEBBLE_DIRECTORY: https://localhost:14000/dir
          ACME_CA_BUNDLE: /tmp/pebble.minica.pem
          ACME_TEST_DNS_URL: http://127.0.0.1:8055
        run: pytest -q tests/integration

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build (includes PJSIP and a pjsua2 import check)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: adhan-bell-pager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          mkdir -p /tmp/abp/config /tmp/abp/audio
          docker run -d --name abp -p 18080:8080 -v /tmp/abp/config:/config -v /tmp/abp/audio:/audio adhan-bell-pager:ci
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:18080/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:18080/api/health
          curl -fsS http://127.0.0.1:18080/ | grep -q "Adhan &amp; Bell Pager"
          docker exec abp python -c "import pjsua2; print('pjsua2 ok')"
          test "$(docker exec abp stat -c %u /proc/1)" = "10001"   # the service process runs unprivileged
          docker exec abp grep -q "^CapEff:.*0000000000000400" /proc/1/status   # only NET_BIND_SERVICE is kept
          docker logs abp | tail -20
