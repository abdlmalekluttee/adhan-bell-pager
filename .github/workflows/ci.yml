name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests scripts
      - name: Unit, integration and permission tests
        run: pytest -q
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: for f in app/static/js/*.js app/static/js/pages/*.js app/static/js/locales/*.js; do node --check "$f"; done
      - name: Shell scripts
        run: for f in scripts/*.sh docker/entrypoint.sh; do bash -n "$f"; done

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (includes PJSIP and a pjsua2 import check)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: adhan-bell-pager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          mkdir -p /tmp/abp/config /tmp/abp/audio
          docker run -d --name abp -p 18080:8080 -v /tmp/abp/config:/config -v /tmp/abp/audio:/audio adhan-bell-pager:ci
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:18080/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:18080/api/health
          curl -fsS http://127.0.0.1:18080/ | grep -q "Adhan &amp; Bell Pager"
          docker exec abp python -c "import pjsua2; print('pjsua2 ok')"
          docker exec abp id -u | grep -q 10001
          docker logs abp | tail -20
