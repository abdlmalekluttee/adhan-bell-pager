# Adhan & Bell Pager
#
#   cp .env.example .env      # adjust WEB_PORT / TZ
#   docker compose up -d --build
#
# Host networking is strongly recommended for SIP: registration and RTP audio
# work without Docker NAT rewriting SIP/SDP. The web UI listens on WEB_PORT.
services:
  adhan-bell-pager:
    build: .
    image: adhan-bell-pager:${APP_VERSION:-local}
    container_name: adhan-bell-pager
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ:-Africa/Tripoli}
      WEB_PORT: ${WEB_PORT:-8080}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      SIP_LOG_LEVEL: ${SIP_LOG_LEVEL:-3}
    volumes:
      - ./config:/config        # settings, database, secret key, logs, backups
      - ./audio:/audio          # Adhan recordings and bell sounds
    stop_grace_period: 30s      # lets an active page hang up cleanly
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Only if you enable "Set system clock" in Time settings:
    # cap_add: [SYS_TIME]
    # environment: RUN_AS_ROOT: "1"
